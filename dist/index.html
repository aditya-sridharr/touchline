label{color:#d8e6f5}.field input,.field select{width:100%;border:0;background:transparent;font-weight:700;color:white;outline:none}.field select option{color:#12233c}.section-bar{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}.section-bar h2{font-size:16px;margin:0}.exercise{background:white;border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}.exercise-top{height:53px;display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid var(--line)}.drag{color:#96a3b5;font-size:19px}.exercise-title{font-weight:780;font-size:16px;border:0;outline:0;flex:1}.exercise-tools{display:flex;gap:5px}.iconbtn{background:transparent;color:#66758a;padding:6px;border-radius:6px}.iconbtn:hover{background:#eef3f6}.exercise-body{display:grid;grid-template-columns:minmax(400px,1.5fr) minmax(270px,.8fr);gap:18px;padding:18px}.pitch-wrap{min-width:0}.toolbar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.tool{background:#f1f4f7;border:1px solid transparent;border-radius:7px;padding:6px 9px;font-size:13px;color:#41526a}.tool.active{background:#e8f7bf;border-color:#a1d668;color:#244417}.ground-toggle{margin-left:auto;border:1px solid #d3dee9;border-radius:7px;padding:6px;background:#fff;color:#24415e}.pitch{height:360px;border-radius:8px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(23,130,76,.9) 0 11%,rgba(17,111,61,.9) 11% 22%),linear-gradient(#2a9c55,#19683a);border:4px solid #f8fbf8;box-shadow:0 2px 6px #72808a;touch-action:none}.pitch:before{content:"";position:absolute;inset:4% 6%;border:2px solid rgba(255,255,255,.9);pointer-events:none}.pitch:after{content:"";position:absolute;top:4%;bottom:4%;left:50%;width:2px;background:rgba(255,255,255,.9);pointer-events:none}.pitch.half:after{display:none}.pitch.half .circle{bottom:-14%;top:auto}.circle{position:absolute;border:2px solid rgba(255,255,255,.9);border-radius:50%;height:28%;aspect-ratio:1;left:ca     .item.selected{outline:0!important;box-shadow:0 0 0 2px #268cff!important;border-radius:0!important}.item.selected:before{content:"";position:absolute;inset:-8px;pointer-events:none;background:linear-gradient(#268cff,#268cff) 0 0/12px 2px no-repeat,linear-gradient(#268cff,#268cff) 0 0/2px 12px no-repeat,linear-gradient(#268cff,#268cff) 100% 0/12px 2px no-repeat,linear-gradient(#268cff,#268cff) 100% 0/2px 12px no-repeat,linear-gradient(#268cff,#268cff) 0 100%/12px 2px no-repeat,linear-gradient(#268cff,#268cff) 0 100%/2px 12px no-repeat,linear-gradient(#268cff,#268cff) 100% 100%/12px 2px no-repeat,linear-gradient(#268cff,#268cff) 100% 100%/2px 12px no-repeat}.area-select{position:absolute;border:1.5px solid #268cff;background:rgba(38,140,255,.12);pointer-events:none;z-index:20}

<body><div class="app">
  <header class="topbar"><div class="brand">touch<span>line</span></div><nav><button class="navbtn active" data-view="editor">Session planner</button><button class="navbtn" data-view="library">Session library</button></nav><div class="top-actions"><button class="btn" id="newSession">New session</button><button class="btn primary" id="saveBtn">Save session</button></div></header>
  <main class="workspace">
    <section class="editor" id="editor"><div class="session-head"><div class="head-title"><input id="sessionName" value="Progressive Play — Middle & Final Third" aria-label="Session name"><span class="saved" id="saveState">Saved locally</span></div><div class="fields">
      <div class="field"><label>Date</label><input id="date" type="date" value="2026-08-04"></div><div class="field"><label>Team</label><input id="team" value="First Team"></div><div class="field"><label>Theme</label><input id="theme" value="Progressive Play"></div><div class="field"><label>Tactical periodisation</label><select id="period"><option>MD-4</option><option>MD-3</option><option>MD-2</option><option>MD-1</option></select></div><div class="field"><label>Age group</label><select id="age"><option>U18/19</option><option>U16</option><option>U14</option><option>Senior</option></select></div><div class="field"><label>Players</label><input id="players" type="number" value="21"></div>
    </div></div><div class="section-bar"><h2>Session flow <span id="exerciseCount">4 exercises</span></h2><button class="btn tiny dark" id="addExercise">+ Add exercise</button></div><div id="exercises"></div></section>
    <section class="library" id="library"><div class="library-hero"><div><h1>Your session library</h1><p style="margin:5px 0;color:var(--muted)">Find, reuse and adapt your best work.</p></div><button class="btn primary" id="libraryNew">+ New session</button></div><div class="search-row"><input id="search" placeholder="Search sessions, exercises, coaching points…"><select id="filterAge"><option value="">All age groups</option><option>U18/19</option><option>U16</option><option>U14</option><option>Senior</option></select><select id="filterPeriod"><option value="">All periodisation</option><option>MD-4</option><option>MD-3</option><option>MD-2</option><option>MD-1</option></select></div><div class="cards" id="cards"></div></section>
  </main></div>
<script>
const initialTitles=['Technical + Warm Up','Rondo','Theme Practice','Small-Sided Game'];let sessions=JSON.parse(localStorage.getItem('touchline-sessions')||'[]');let exercises=[];let selected=null;let dragging=null;
const $=s=>document.querySelector(s),el=(tag,attrs={},html='')=>{const x=document.createElement(tag);const {dataset,...rest}=attrs;Object.assign(x,rest);if(dataset)Object.assign(x.dataset,dataset);x.innerHTML=html;return x};
function seedItems(i){return i===1?[{type:'player',color:'blue',n:8,x:25,y:35},{type:'player',color:'blue',n:10,x:35,y:60},{type:'player',color:'red',n:4,x:63,y:30},{type:'player',color:'red',n:7,x:72,y:64},{type:'cone',x:18,y:20},{type:'cone',x:82,y:78},{type:'ball',x:48,y:47},{type:'arrow',x:52,y:35}]:[]}
function makeExercise(title,items=[]){return {id:crypto.randomUUID(),title,collapsed:false,items,points:'• Accuracy & weight of pass\n• Body shape to switch\n• Supporting lines',progress:'• Reduce the number of touches\n• Add another defender',explain:'Organise the area early. Encourage players to recognise the next forward pass and support the ball at the right angle.'}}
function init(){exercises=initialTitles.map((t,i)=>makeExercise(t,seedItems(i)));renderExercises();}
function itemHTML(it){let c='item '+it.type;if(it.type==='player')return `<div class="${c} ${it.color||'blue'}" style="left:${it.x}%;top:${it.y}%" data-item="${it.id}">${it.n||'?'}</div>`;if(it.type==='cone')return `<div class="${c}" style="left:${it.x}%;top:${it.y}%" data-item="${it.id}">🔺</div>`;if(it.type==='ball')return `<div class="${c}" style="left:${it.x}%;top:${it.y}%" data-item="${it.id}">⚽</div>`;if(it.type==='arrow')return `<div class="${c}" style="left:${it.x}%;top:${it.y}%" data-item="${it.id}">➜</div>`;return `<div class="${c}" style="left:${it.x}%;top:${it.y}%" data-item="${it.id}">${it.text||'Note'}</div>`}
function renderExercises(){const root=$('#exercises');root.innerHTML='';exercises.forEach((ex,index)=>{const card=el('article',{className:'exercise',dataset:{id:ex.id}});card.innerHTML=`<div class="exercise-top"><span class="drag">⠿</span><input class="exercise-title" value="${ex.title}" aria-label="Exercise title"><span class="cap">${String(index+1).padStart(2,'0')}</span><div class="exercise-tools"><button class="iconbtn up" title="Move up">↑</button><button class="iconbtn down" title="Move down">↓</button><button class="iconbtn duplicate" title="Duplicate">⧉</button><button class="iconbtn remove" title="Remove">×</button><button class="iconbtn toggle" title="Collapse">⌃</button></div></div><div class="exercise-body"><div class="pitch-wrap"><div class="toolbar"><button class="tool active">Select</button><button class="tool" data-add="player">● Player</button><button class="tool" data-add="ball">⚽ Ball</button><button class="tool" data-add="cone">△ Cone</button><button class="tool" data-add="arrow">➜ Arrow</button><button class="tool" data-add="label">T Text</button><button class="tool delete">Delete selected</button></div><div class="pitch" data-pitch="${ex.id}"><div class="circle"></div><div class="goal left"></div><div class="goal right"></div>${ex.items.map(itemHTML).join('')}</div></div><div class="notes"><div class="note-card"><button class="collapse">−</button><h3>Coaching points</h3><textarea class="points">${ex.points}</textarea></div><div class="note-card"><button class="collapse">−</button><h3>Progressions</h3><textarea class="progress">${ex.progress}</textarea></div></div><div class="explanation"><span class="cap">Explanation & instructions</span><textarea class="explain">${ex.explain}</textarea></div></div>`;root.append(card);wireExercise(card,ex,index)});$('#exerciseCount').textContent=`${exercises.length} exercise${exercises.length===1?'':'s'}`}
function wireExercise(card,ex,index){const body=card.querySelector('.exercise-body');card.querySelector('.toggle').onclick=()=>{body.hidden=!body.hidden;card.querySelector('.toggle').textContent=body.hidden?'⌄':'⌃'};card.querySelector('.exercise-title').oninput=e=>{ex.title=e.target.value;autoSave()};['points','progress','explain'].forEach(k=>card.querySelector('.'+k).oninput=e=>{ex[k]=e.target.value;autoSave()});card.querySelector('.duplicate').onclick=()=>{const copy=structuredClone(ex);copy.id=crypto.randomUUID();copy.title+=' (copy)';copy.items.forEach(x=>x.id=crypto.randomUUID());exercises.splice(index+1,0,copy);renderExercises();autoSave()};card.querySelector('.remove').onclick=()=>{if(exercises.length>1){exercises.splice(index,1);renderExercises();autoSave()}};card.querySelector('.up').onclick=()=>{if(index){[exercises[index-1],exercises[index]]=[exercises[index],exercises[index-1]];renderExercises();autoSave()}};card.querySelector('.down').onclick=()=>{if(index<exercises.length-1){[exercises[index+1],exercises[index]]=[exercises[index],exercises[index+1]];renderExercises();autoSave()}};card.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const type=b.dataset.add;let it={id:crypto.randomUUID(),type,x:50,y:50};if(type==='player'){it.color=['blue','red','yellow'][ex.items.filter(x=>x.type==='player').length%3];it.n=ex.items.filter(x=>x.type==='player').length+1}if(type==='label')it.text='New note';ex.items.push(it);renderExercises();autoSave()});card.querySelector('.delete').onclick=()=>{if(selected?.ex===ex.id){ex.items=ex.items.filter(i=>i.id!==selected.id);selected=null;renderExercises();autoSave()}};card.querySelectorAll('.collapse').forEach(b=>b.onclick=()=>{const n=b.parentElement;n.classList.toggle('collapsed');b.textContent=n.classList.contains('collapsed')?'＋':'−'});const pitch=card.querySelector('.pitch');pitch.addEventListener('pointerdown',e=>{const target=e.target.closest('[data-item]');if(!target)return;const id=target.dataset.item;selected={ex:ex.id,id};pitch.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));target.classList.add('selected');dragging={ex,id,pitch};target.setPointerCapture(e.pointerId)});pitch.addEventListener('pointermove',e=>{if(!dragging||dragging.ex!==ex)return;const r=pitch.getBoundingClientRect(),it=ex.items.find(x=>x.id===dragging.id);it.x=Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100));it.y=Math.max(4,Math.min(96,(e.clientY-r.top)/r.height*100));const node=pitch.querySelector(`[data-item="${it.id}"]`);node.style.left=it.x+'%';node.style.top=it.y+'%'});pitch.addEventListener('pointerup',()=>{if(dragging){dragging=null;autoSave()}})}
function data(){return {id:window.currentId||crypto.randomUUID(),name:$('#sessionName').value,date:$('#date').value,team:$('#team').value,theme:$('#theme').value,period:$('#period').value,age:$('#age').value,players:$('#players').value,exercises:structuredClone(exercises),updated:Date.now()}}
function load(d){window.currentId=d.id;['sessionName','date','team','theme','period','age','players'].forEach(k=>{$('#'+k).value=d[k]||''});exercises=d.exercises||[];renderExercises()}
function save(){const d=data();window.currentId=d.id;const p=sessions.findIndex(x=>x.id===d.id);if(p>=0)sessions[p]=d;else sessions.unshift(d);localStorage.setItem('touchline-sessions',JSON.stringify(sessions));$('#saveState').textContent='Saved locally';renderLibrary()}
function autoSave(){$('#saveState').textContent='Saving…';clearTimeout(window.st);window.st=setTimeout(save,450)}

document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;const mod=e.metaKey||e.ctrlKey;if(mod&&e.key.toLowerCase()==='c'){const nodes=selectedItems();if(!nodes.length)return;e.preventDefault();copiedAssets=nodes.map(n=>{const {ex}=findExercise(n);return structuredClone(ex.items.find(i=>i.id===n.dataset.item))})}if(mod&&e.key.toLowerCase()==='v'&&copiedAssets?.length){e.preventDefault();const target=activeAsset&&exercises.find(x=>x.id===activeAsset.ex)||exercises[0];copiedAssets.forEach((item,n)=>{const c=structuredClone(item);c.id=crypto.randomUUID();c.x=Math.min(94,(c.x||50)+5+n*2);c.y=Math.min(94,(c.y||50)+5+n*2);target.items.push(c)});renderUpgraded();autoSave()}},true);

/* Authoritative direct manipulation layer for every pitch asset. */
let directDrag=null;
document.addEventListener('pointerdown',e=>{const node=e.target.closest('[data-item]');if(!node)return;const {ex}=findExercise(node);const it=ex?.items.find(x=>x.id===node.dataset.item);if(!it)return;const wasSelected=node.classList.contains('selected');if(node.classList.contains('label-item')&&wasSelected&&!e.target.closest('.resize-handle')){node.focus();e.stopImmediatePropagation();return}document.querySelectorAll('.item.selected').forEach(n=>n.classList.remove('selected'));node.classList.add('selected');activeAsset={ex:ex.id,id:it.id};const mode=e.target.closest('.resize-handle')?'resizeAsset':e.target.closest('.end')?'resizeArrow':e.target.closest('.rotate')?'rotateArrow':'move';directDrag={node,it,pitch:node.closest('.pitch'),mode,x:e.clientX,y:e.clientY,moved:false};node.setPointerCapture?.(e.pointerId);e.preventDefault();e.stopImmediatePropagation()},true);
document.addEventListener('pointermove',e=>{if(!directDrag)return;const d=directDrag,r=d.pitch.getBoundingClientRect(),it=d.it;if(Math.abs(e.clientX-d.x)+Math.abs(e.clientY-d.y)>3)d.moved=true;if(d.mode==='move'){it.x=Math.max(3,Math.min(97,(e.clientX-r.left)/r.width*100));it.y=Math.max(3,Math.min(97,(e.clientY-r.top)/r.height*100));d.node.style.left=it.x+'%';d.node.style.top=it.y+'%';return}const sx=r.left+r.width*it.x/100,sy=r.top+r.height*it.y/100,dx=e.clientX-sx,dy=e.clientY-sy;if(d.mode==='resizeAsset'){it.scale=Math.max(.35,Math.min(3.5,Math.hypot(dx,dy)/42));d.node.style.setProperty('--scale',it.scale)}else{it.angle=Math.atan2(dy,dx)*180/Math.PI;if(d.mode==='resizeArrow')it.len=Math.max(25,Math.min(360,Math.hypot(dx,dy)));d.node.style.setProperty('--angle',it.angle+'deg');d.node.style.setProperty('--length',it.len+'px')}},true);
document.addEventListener('pointerup',()=>{if(!directDrag)return;directDrag=null;autoSave()},true);
</script><script>
/* Keep player identifiers unique after duplicate/paste and start Rondos clean. */
seedItems=()=>[];
function renumberPastedPlayers(){const target=activeAsset&&exercises.find(x=>x.id===activeAsset.ex)||exercises[0];if(!target)return;const seen=new Set(),players=target.items.filter(x=>x.type==='player');let next=Math.max(0,...players.map(x=>Number(x.n)||0))+1;players.forEach(p=>{const n=Number(p.n);if(!n||seen.has(n)){p.n=next++;}seen.add(Number(p.n))})}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='v'&&copiedAssets?.some(x=>x.type==='player')){setTimeout(()=>{renumberPastedPlayers();renderUpgraded();autoSave()},0)}},true);
if(!localStorage.getItem('touchline-rondo-assets-removed')){sessions.forEach(s=>s.exercises?.forEach(e=>{if(e.title==='Rondo')e.items=[]}));exercises.forEach(e=>{if(e.title==='Rondo')e.items=[]});localStorage.setItem('touchline-sessions',JSON.stringify(sessions));localStorage.setItem('touchline-rondo-assets-removed','true');renderUpgraded()}
</script></body></html>
